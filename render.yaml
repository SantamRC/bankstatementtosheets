# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render Dashboard → New → Blueprint → pick this repo. Secrets marked `sync: false` are prompted for on first deploy.
services:
  - type: web
    name: bankstatementtosheets
    runtime: node
    # Starter = always on (free instances sleep after 15 min and cold-start in ~1 min — bad for paying users).
    # Move to Standard (2 GB RAM) if large PDFs / concurrent uploads hit memory limits.
    plan: starter
    # Keep the same region as your Supabase project to minimise DB latency.
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Don't set NODE_ENV here: `npm ci` would skip devDependencies (Tailwind, TypeScript) that the build needs.
      # `next build` / `next start` set production mode themselves.
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://bankstatementtosheets.com
      - key: APP_SECRET
        generateValue: true

      # Claude
      - key: ANTHROPIC_API_KEY
        sync: false
      # Cascade: every page on the fast model; only chunks that fail balance verification re-run on the strong one.
      - key: EXTRACTION_MODE
        value: cascade
      - key: EXTRACTION_MODEL_FAST
        value: claude-haiku-5-5
      - key: EXTRACTION_MODEL_STRONG
        value: claude-opus-5-5
      - key: EXTRACTION_EFFORT
        value: medium

      # Supabase (NEXT_PUBLIC_* are inlined at build time — redeploy after changing them)
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_AUTH_GOOGLE
        value: "0"

      # Dodo Payments (merchant of record)
      - key: DODO_PAYMENTS_API_KEY
        sync: false
      - key: DODO_PAYMENTS_WEBHOOK_KEY
        sync: false
      - key: DODO_PAYMENTS_ENVIRONMENT
        value: test_mode
      - key: DODO_PRODUCT_STARTER_MONTHLY
        sync: false
      - key: DODO_PRODUCT_STARTER_YEARLY
        sync: false
      - key: DODO_PRODUCT_PRO_MONTHLY
        sync: false
      - key: DODO_PRODUCT_PRO_YEARLY
        sync: false
      - key: DODO_PRODUCT_BUSINESS_MONTHLY
        sync: false
      - key: DODO_PRODUCT_BUSINESS_YEARLY
        sync: false
      - key: DODO_PRODUCT_PACK_100
        sync: false

      # Google Sheets export
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
